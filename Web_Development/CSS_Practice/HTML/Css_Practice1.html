<!--CSS stands for Cascading Style Sheets
CSS describes how HTML elements are to be displayed on screen, paper, or in other media
CSS saves a lot of work. It can control the layout of multiple web pages all at once
External stylesheets are stored in CSS files-->

<html lang="en-US">
<head>
    <link rel="stylesheet" href="/CSS_Practice/CSS/Css_Practice1.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <p class="class_selector">This is a p class selector</p>
    <p class="opacity1">Background Color with Opacity</p>
    <p>This is not a p class selector</p>

    <hr>

    <div class="div1">
        <p style="border-style: dotted; border-width: 2px; width: 150px; text-align: center; padding: 10px;">Border1</p>
        <p style="border-style: dashed; border-width: 3px; width: 150px; text-align: center; padding: 10px;">Border2</p>
        <p style="border-style: solid; border-width: 4px 2px; width: 150px; text-align: center; padding: 10px;">Border3</p><!--The border-width property can have from one to four values 
        (for the top border, right border, bottom border, and the left border):-->
        <p style="border-style: double; border-width: 5px; border-color: rgb(83, 160, 233) rgb(21, 31, 121); width: 150px; text-align: center; padding: 10px;">Border4</p>
        <!--The border-color property is used to set the color of the four borders. The border-color property can have from one to four values (for the top border, right border, bottom border, and the left border). -->
        <p style="border-top-style: groove; border-width: 6px; width: 150px; text-align: center; padding: 10px;">Border5</p>
        <p style="border-style: groove ridge; border-width: 7px; width: 150px; text-align: center; padding: 10px;">Border6</p><!--We can also use the shorthand border-style property-->
        <p style="border: 8px inset rgb(160, 161, 240); width: 150px; text-align: center; padding: 10px;">Border7</p>
        <!--The border property is a shorthand property for the following individual border properties:

        border-width
        border-style (required)
        border-color
        Example-->
        <p style="border-style: outset; border-width: 9px; border-radius: 10px; width: 150px; text-align: center; padding: 10px;">Border8</p><!--The border-radius property is used to add rounded borders to an element:-->
        <p style="border-style: none;">Border9</p>
        <p style="border: hidden">Border10</p>
    </div>
    <!--The border-style property specifies what kind of border to display.

    The following values are allowed:

    dotted - Defines a dotted border
    dashed - Defines a dashed border
    solid - Defines a solid border
    double - Defines a double border
    groove - Defines a 3D grooved border. The effect depends on the border-color value
    ridge - Defines a 3D ridged border. The effect depends on the border-color value
    inset - Defines a 3D inset border. The effect depends on the border-color value
    outset - Defines a 3D outset border. The effect depends on the border-color value
    none - Defines no border
    hidden - Defines a hidden border
    The border-style property can have from one to four values (for the top border, right border, bottom border, and the left border).
    
    The border-width property specifies the width of the four borders.

    The width can be set as a specific size (in px, pt, cm, em, etc) or by using one of the three pre-defined values: thin, medium, or thick:

    From the examples on the previous pages, you have seen that it is possible to specify a different border for each side.

    In CSS, there are also properties for specifying each of the borders (top, right, bottom, and left):

    border-top-style
    border-right-style
    border-bottom-style
    border-left-style

    If the border-style property has four values:

    border-style: dotted solid double dashed;
    top border is dotted
    right border is solid
    bottom border is double
    left border is dashed
    -->
    <hr>
    <p class="margin1">Margin Example 1</p>
    <p class="margin2">Margin Example 2</p>
    <p class="margin3">Margin Example 3</p>
    <div class="div2">
        <p class="margin4">Margin Example 4</p>
    </div>

    <hr>
